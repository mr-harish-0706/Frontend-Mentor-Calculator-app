<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Calculator app</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator">
      <header>
        <h1 class="calc">calc</h1>
        <div class="theme-container">
          <p class="theme-text">THEME</p>
          <div class="toggle-wrapper" id="theme-toggle">
            <div class="theme-labels">
              <span>1</span>
              <span>2</span>
              <span>3</span>
            </div>
            <div class="toggle-bar">
              <div class="toggle-ball"></div>
            </div>
          </div>
        </div>
      </header>
      <input type="text" name="display" id="display" readonly value="0" />
      <div class="keypad">
        <button type="button" class="buttons" data-key="7">7</button>
        <button type="button" class="buttons" data-key="8">8</button>
        <button type="button" class="buttons" data-key="9">9</button>
        <button type="button" class="buttons delete" id="delete">DEL</button>
        <button type="button" class="buttons" data-key="4">4</button>
        <button type="button" class="buttons" data-key="5">5</button>
        <button type="button" class="buttons" data-key="6">6</button>
        <button type="button" class="buttons" data-key="+">+</button>
        <button type="button" class="buttons" data-key="1">1</button>
        <button type="button" class="buttons" data-key="2">2</button>
        <button type="button" class="buttons" data-key="3">3</button>
        <button type="button" class="buttons" data-key="-">-</button>
        <button type="button" class="buttons" data-key=".">.</button>
        <button type="button" class="buttons" data-key="0">0</button>
        <button type="button" class="buttons" data-key="/">/</button>
        <button type="button" class="buttons" data-key="*">x</button>
        <button type="button" class="buttons reset" id="reset">RESET</button>
        <button type="button" class="buttons equal" id="equals">=</button>
      </div>
    </main>

    <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div> -->

    <script src="script.js"></script>
  </body>
</html>
